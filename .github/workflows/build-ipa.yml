name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app
          xcodebuild -version
          cmake --version | head -1

      # llama.cpp 固定版本，保证可复现构建（该提交含 qwen3 聊天解析器）
      - name: Clone llama.cpp (pinned)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp && git fetch --depth 1 origin f5919bf458ef190468b5c329bb293f8a54a1e69c && git checkout f5919bf458ef190468b5c329bb293f8a54a1e69c

      - name: Build llama.xcframework
        working-directory: llama.cpp
        run: |
          ./build-xcframework.sh

      - name: Verify xcframework
        run: |
          ls -la build-apple/llama.xcframework
          ls build-apple/llama.xcframework

      - name: Build AgentBox .app (unsigned)
        run: |
          xcodebuild \
            -project AgentBox.xcodeproj \
            -target AgentBox \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find .app
        run: |
          find build -name "AgentBox.app" -type d
          APP_PATH=$(find build -name "AgentBox.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Assemble unsigned .ipa
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/AgentBox.app/_CodeSignature
          /usr/bin/ditto -c -k --keepParent Payload AgentBox.unsigned.ipa
          ls -la AgentBox.unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: AgentBox-unsigned-ipa
          path: AgentBox.unsigned.ipa
          if-no-files-found: error

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: AgentBox-app
          path: build/Build/Products/Release-iphoneos/AgentBox.app
          if-no-files-found: error
